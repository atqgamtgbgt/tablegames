<main id="main">
  <div class="shell"><div class="hero"><h1>読み込んでいます</h1>
    <p class="boot-hint">表示が変わらないときは、JavaScriptが止められている画面で開いている可能性があります（アプリ内のファイルのプレビューなど）。

<noscript>
  <div class="shell"><div class="hero">

  </div></div>
</noscript>

<script>
  // 古いブラウザなどでアプリ本体が読めなかったとき、「読み込んでいます」のまま止まらないようにする
  (function () {
    var done = false;
    function fail() {
      var m = document.getElementById('main');
      if (done || !m || !/読み込んでいます/.test(m.textContent)) return;
      done = true;
      m.innerHTML = '<div class="shell"><div class="hero"><h1>このブラウザでは開けませんでした</h1>'
        + '<p>ブラウザを最新版に更新するか、新しいChrome・Safari・Edge・Firefoxで開いてください。</p></div></div>';
    }
    window.addEventListener('error', function () { setTimeout(fail, 0); });
    window.addEventListener('load', function () { setTimeout(fail, 15000); });
  })();
</script>
